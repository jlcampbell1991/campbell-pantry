[package]
name = "campbell-pantry"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", default-features = false, features = [
    "http1",
    "tokio",
] }
tokio = { version = "1.49", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
] }
